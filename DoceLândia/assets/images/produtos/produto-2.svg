    <rect x="85" y="90" width="8" height="3" rx="1.5" fill="#FFF5BA" transform="rotate(-30 85 90)"/>
    <rect x="65" y="75" width="8" height="3" rx="1.5" fill="#B5EAD7" transform="rotate(45 65 75)"/>
    <rect x="95" y="105" width="8" height="3" rx="1.5" fill="#FFB7B2" transform="rotate(10 95 105)"/>
