<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <rect width="400" height="300" rx="16" fill="#E1F5FE" opacity="0.3"/>
  <circle cx="200" cy="150" r="110" fill="#FFF9F5"/>
  <g transform="translate(130, 60)">
    <!-- Cupcake Liner -->
    <path d="M 25 120 L 40 190 Q 70 200 100 190 L 115 120 Z" fill="#FFB7B2" />
    <path d="M 30 120 L 43 190 M 50 120 L 58 194 M 70 120 L 70 195 M 90 120 L 82 194 M 110 120 L 97 190" stroke="#FFDAC1" stroke-width="2"/>
