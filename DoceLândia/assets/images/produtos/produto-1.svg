<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <rect width="400" height="300" rx="16" fill="#FFF5BA" opacity="0.3"/>
  <circle cx="200" cy="150" r="110" fill="#FFF9F5"/>
  <defs>
    <filter id="shadow1" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="5" flood-color="#553" flood-opacity="0.12"/>
    </filter>
  </defs>
  <g filter="url(#shadow1)">
    <!-- Macaron 1 (Pink) -->
    <g transform="translate(140, 90)">
      <rect x="0" y="0" width="120" height="32" rx="16" fill="#F8BBD0"/>
      <rect x="6" y="28" width="108" height="12" rx="4" fill="#F48FB1"/>
      <rect x="0" y="36" width="120" height="32" rx="16" fill="#F8BBD0"/>
      <rect x="12" y="26" width="96" height="14" rx="7" fill="#FFFFFF" opacity="0.9"/>
    </g>
    <!-- Macaron 2 (Blue) -->
    <g transform="translate(120, 140)">
      <rect x="0" y="0" width="120" height="32" rx="16" fill="#81D4FA"/>
      <rect x="6" y="28" width="108" height="12" rx="4" fill="#4FC3F7"/>
      <rect x="0" y="36" width="120" height="32" rx="16" fill="#81D4FA"/>
      <rect x="12" y="26" width="96" height="14" rx="7" fill="#FFFFFF" opacity="0.9"/>
    </g>
    <!-- Macaron 3 (Mint) -->
    <g transform="translate(150, 190)">
      <rect x="0" y="0" width="120" height="32" rx="16" fill="#B5EAD7"/>
      <rect x="6" y="28" width="108" height="12" rx="4" fill="#7ECEB4"/>
      <rect x="0" y="36" width="120" height="32" rx="16" fill="#B5EAD7"/>
      <rect x="12" y="26" width="96" height="14" rx="7" fill="#FFFFFF" opacity="0.9"/>
    </g>
  </g>
</svg>
