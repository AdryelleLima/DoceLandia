    <circle cx="90" cy="90" r="25" fill="#FFF9F5"/>
    <!-- Glaze -->
    <path d="M 90 17 A 73 73 0 0 1 163 90 C 150 95 145 80 135 90 C 125 100 120 85 110 95 C 100 85 90 95 85 85 C 75 95 65 85 55 90 C 45 80 35 95 17 90 A 73 73 0 0 1 90 17 Z" fill="#F8BBD0"/>
