    <!-- Sprinkles -->
    <rect x="70" y="40" width="10" height="4" rx="2" fill="#81D4FA" transform="rotate(30 70 40)"/>
    <rect x="110" y="45" width="10" height="4" rx="2" fill="#FFF5BA" transform="rotate(-40 110 45)"/>
    <rect x="135" y="75" width="10" height="4" rx="2" fill="#B5EAD7" transform="rotate(15 135 75)"/>
    <rect x="45" y="70" width="10" height="4" rx="2" fill="#FFB7B2" transform="rotate(60 45 70)"/>
    <rect x="80" y="140" width="10" height="4" rx="2" fill="#81D4FA" transform="rotate(-15 80 140)"/>
  </g>
</svg>
