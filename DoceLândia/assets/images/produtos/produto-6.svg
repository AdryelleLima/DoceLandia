<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <rect width="400" height="300" rx="16" fill="#E1F5FE" opacity="0.3"/>
  <circle cx="200" cy="150" r="110" fill="#FFF9F5"/>
  <g transform="translate(100, 60)">
    <!-- Glass Jar -->
    <rect x="40" y="50" width="120" height="150" rx="20" fill="#E1F5FE" opacity="0.5" stroke="#81D4FA" stroke-width="3"/>
    <rect x="50" y="30" width="100" height="20" rx="6" fill="#F8BBD0"/>
    <!-- Marshmallows Inside -->
    <g transform="translate(55, 65)">
      <rect x="0" y="80" width="40" height="25" rx="12" fill="#FFB7B2"/>
      <rect x="45" y="85" width="40" height="25" rx="12" fill="#B5EAD7"/>
      <rect x="20" y="50" width="45" height="25" rx="12" fill="#FFF5BA"/>
      <rect x="60" y="55" width="40" height="25" rx="12" fill="#FFD1DC"/>
      <rect x="30" y="20" width="45" height="25" rx="12" fill="#81D4FA"/>
    </g>
    <!-- Cute Ribbon -->
    <path d="M 50 40 Q 100 55 150 40" stroke="#FF8B94" stroke-width="6" fill="none"/>
    <circle cx="100" cy="45" r="8" fill="#FF8B94"/>
  </g>
</svg>
